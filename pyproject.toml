[project]
name = "sensenova-u15-t8"
version = "1.3.6"
description = "Native ComfyUI nodes for SenseNova-U1.5 text-to-image generation and multi-reference image editing."
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Operating System :: OS Independent",
    "Environment :: GPU :: NVIDIA CUDA",
]

[project.urls]
Homepage = "https://registry.comfy.org/nodes/sensenova-u15-t8"
Repository = "https://github.com/T8mars/Comfyui-SenseNova-U1.5-Wrapper-T8"
Documentation = "https://github.com/T8mars/Comfyui-SenseNova-U1.5-Wrapper-T8#readme"
"Bug Tracker" = "https://github.com/T8mars/Comfyui-SenseNova-U1.5-Wrapper-T8/issues"
"Model Download" = "https://huggingface.co/t8star/SenseNova-U1.5-Comfy/"
"Release Notes" = "https://github.com/T8mars/Comfyui-SenseNova-U1.5-Wrapper-T8/releases"

[tool.comfy]
PublisherId = "t8star"
DisplayName = "SenseNova U1.5 (T8)"
requires-comfyui = ">=0.31.0"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]
